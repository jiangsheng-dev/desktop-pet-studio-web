<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌面宠物工坊 · Desktop Pet Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23ff6b45'/%3E%3Cg fill='%23fff'%3E%3Cellipse cx='6.1' cy='11.6' rx='1.55' ry='2.05'/%3E%3Cellipse cx='17.9' cy='11.6' rx='1.55' ry='2.05'/%3E%3Cellipse cx='9.4' cy='7.5' rx='1.35' ry='1.85'/%3E%3Cellipse cx='14.6' cy='7.5' rx='1.35' ry='1.85'/%3E%3Cpath d='M12 13.1c-2.35 0-4.7 2.85-4.7 4.85 0 1.25.95 2.05 2.2 2.05.9 0 1.6-.4 2.5-.4s1.6.4 2.5.4c1.25 0 2.2-.8 2.2-2.05 0-2-2.35-4.85-4.7-4.85Z'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --ink:#1d1a17;
    --ink-2:#5d574f;
    --ink-3:#938b80;
    --line:rgba(29,26,23,.09);
    --card:rgba(255,255,255,.93);
    --bg:#f7f4f0;
    --brand:#ff6b45;
    --brand-2:#ff477e;
    --shadow:0 18px 46px rgba(60,44,28,.10), 0 2px 8px rgba(60,44,28,.05);
    --radius:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 620px at 8% -12%, #fff4ec 0%, rgba(255,244,236,0) 62%),
      radial-gradient(900px 560px at 96% -6%, #eaf1ff 0%, rgba(234,241,255,0) 58%),
      linear-gradient(180deg, #f9f6f2 0%, #f3efe9 100%);
    background-attachment:fixed;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- 背景光斑 ---------- */
  .bg-fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:floaty 18s ease-in-out infinite;}
  .orb-1{width:520px;height:520px;background:radial-gradient(circle,#ffc9b8,transparent 68%);top:-180px;left:-120px;}
  .orb-2{width:560px;height:560px;background:radial-gradient(circle,#c9d8ff,transparent 68%);top:10%;right:-200px;animation-delay:-6s;}
  .orb-3{width:480px;height:480px;background:radial-gradient(circle,#ffe3b0,transparent 68%);bottom:-200px;left:30%;animation-delay:-11s;}
  @keyframes floaty{
    0%,100%{transform:translate3d(0,0,0) scale(1);}
    50%{transform:translate3d(30px,-40px,0) scale(1.08);}
  }

  /* ---------- 顶栏 ---------- */
  .topbar{
    flex:0 0 auto;width:100%;position:relative;z-index:2;
    max-width:1160px;margin:0 auto;
    padding:34px 28px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{
    width:46px;height:46px;flex:0 0 auto;border-radius:15px;
    display:grid;place-items:center;color:#fff;
    background:linear-gradient(140deg,var(--brand),var(--brand-2));
    box-shadow:0 8px 20px rgba(255,90,80,.30);
  }
  .brand-mark svg{width:24px;height:24px;}
  .brand h1{font-size:19px;line-height:1.2;margin:0;letter-spacing:-.3px;font-weight:680;}
  .brand p{margin:3px 0 0;font-size:12.5px;color:var(--ink-3);}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 14px;border-radius:999px;font-size:12.5px;color:var(--ink-2);
    background:rgba(255,255,255,.72);border:1px solid var(--line);
    backdrop-filter:blur(14px);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.15);}
  .dot.busy{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.15);animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.35;}}

  /* ---------- 布局 ---------- */
  .wrap{position:relative;z-index:2;flex:1 0 auto;width:100%;max-width:1160px;margin:0 auto;padding:18px 28px 40px;display:flex;flex-direction:column;}
  .wrap::before,.wrap::after{content:"";flex:1 1 0;min-height:0;}
  .card{
    background:var(--card);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:var(--shadow);
    border-radius:var(--radius);
    backdrop-filter:blur(22px);
    padding:24px;
    margin-bottom:18px;
    animation:rise .5s cubic-bezier(.2,.9,.25,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  h2{font-size:15px;margin:0 0 14px;font-weight:660;letter-spacing:-.2px;}

  /* ---------- 上传区 ---------- */
  .dropzone{
    border:1.6px dashed rgba(29,26,23,.18);
    border-radius:18px;
    padding:48px 24px;
    text-align:center;
    cursor:pointer;
    transition:border-color .22s, background .22s, transform .22s;
    background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,252,249,.2));
    outline:none;
  }
  .dropzone:hover,.dropzone:focus-visible{border-color:rgba(255,107,69,.55);background:rgba(255,246,241,.7);}
  .dropzone.drag{border-color:var(--brand);background:rgba(255,240,234,.9);transform:scale(1.008);}
  .dz-icon{
    width:56px;height:56px;margin:0 auto 16px;border-radius:18px;
    display:grid;place-items:center;color:var(--brand);
    background:linear-gradient(140deg,rgba(255,107,69,.13),rgba(255,71,126,.10));
  }
  .dz-icon svg{width:26px;height:26px;}
  .dz-title{font-size:15.5px;font-weight:620;}
  .dz-sub{margin-top:7px;font-size:12.5px;color:var(--ink-3);}

  /* ---------- 三步说明 ---------- */
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:18px;}
  @media (max-width:760px){.steps{grid-template-columns:1fr;}}
  .step{
    position:relative;overflow:hidden;
    background:rgba(255,255,255,.62);
    border:1px solid rgba(255,255,255,.95);
    border-radius:18px;padding:17px 18px 19px;
    backdrop-filter:blur(14px);
    transition:transform .25s, box-shadow .25s, background .25s;
  }
  .step:hover{transform:translateY(-2px);background:rgba(255,255,255,.82);box-shadow:0 12px 26px rgba(60,44,28,.07);}
  .step-no{font-size:10.5px;font-weight:750;color:var(--brand);letter-spacing:.1em;}
  .step h3{margin:7px 0 5px;font-size:13.5px;font-weight:660;letter-spacing:-.1px;}
  .step p{margin:0;font-size:11.8px;color:var(--ink-3);line-height:1.62;}

  /* ---------- 编辑区 ---------- */
  .editor-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:start;}
  @media (max-width:860px){.editor-grid{grid-template-columns:1fr;}}

  .checker{
    background-color:#faf8f5;
    background-image:
      linear-gradient(45deg,#e9e5df 25%,transparent 25%),
      linear-gradient(-45deg,#e9e5df 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#e9e5df 75%),
      linear-gradient(-45deg,transparent 75%,#e9e5df 75%);
    background-size:20px 20px;
    background-position:0 0,0 10px,10px -10px,-10px 0;
  }
  .preview-wrap{
    position:relative;border-radius:16px;overflow:hidden;
    border:1px solid var(--line);
    display:grid;place-items:center;
    min-height:300px;max-height:420px;padding:8px;
  }
  .preview-wrap img{max-width:100%;max-height:400px;display:block;object-fit:contain;}
  .processing{
    position:absolute;inset:0;display:none;grid-auto-flow:column;place-items:center;justify-content:center;gap:11px;
    background:rgba(255,255,255,.78);backdrop-filter:blur(4px);
    font-size:13px;color:var(--ink-2);font-weight:550;
  }
  .processing.show{display:grid;}
  .spinner{
    width:20px;height:20px;border-radius:50%;
    border:2.2px solid #e8e2da;border-top-color:var(--brand);
    animation:spin .75s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .preview-meta{margin-top:10px;font-size:12px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap;}
  .preview-meta b{color:var(--ink-2);font-weight:600;}

  .slider{margin-bottom:16px;}
  .slider > span{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-bottom:8px;}
  .slider > span b{color:var(--brand);font-weight:660;font-variant-numeric:tabular-nums;}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:99px;
    background:linear-gradient(90deg,var(--brand),#ffb56b);outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:#fff;
    border:2px solid var(--brand);box-shadow:0 2px 6px rgba(255,90,60,.28);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid var(--brand);cursor:pointer;
  }

  .btn{
    border:0;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;
    padding:10px 16px;border-radius:12px;transition:transform .16s, box-shadow .16s, background .16s, color .16s;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.97);}
  .btn.primary{
    background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
    box-shadow:0 8px 22px rgba(255,86,84,.30);
  }
  .btn.primary:hover{box-shadow:0 11px 28px rgba(255,86,84,.38);}
  .btn.ghost{background:rgba(29,26,23,.045);color:var(--ink-2);}
  .btn.ghost:hover{background:rgba(29,26,23,.085);color:var(--ink);}
  .btn.danger{background:rgba(239,68,68,.10);color:#dc2626;}
  .btn.danger:hover{background:#dc2626;color:#fff;box-shadow:0 8px 18px rgba(220,38,38,.28);}
  .btn.big{width:100%;padding:14px;font-size:14px;border-radius:14px;margin-top:4px;}
  .btn.sm{padding:7px 12px;font-size:12px;border-radius:10px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-row{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;}
  .btn-row .btn{flex:1;}
  .tip{margin:12px 0 0;font-size:11.8px;color:var(--ink-3);line-height:1.65;}

  /* ---------- 形象库：固定 6 槽位 ---------- */
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;}
  .sec-head h2{display:flex;align-items:center;gap:8px;margin:0;}
  .slot-count{
    padding:5px 9px;border-radius:999px;background:rgba(29,26,23,.055);
    color:var(--ink-3);font-size:10.5px;font-weight:650;line-height:1;letter-spacing:.2px;
  }
  .slot-count.full{background:rgba(239,68,68,.10);color:#dc2626;}
  .gallery{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;}
  .pet-slot{position:relative;width:100%;max-width:112px;margin:0 auto;min-width:0;}
  .pet-card{
    width:100%;min-width:0;border:0;background:transparent;cursor:pointer;padding:0;
    display:flex;flex-direction:column;gap:7px;align-items:center;font-family:inherit;
  }
  .pet-thumb{
    position:relative;width:100%;max-width:112px;aspect-ratio:1;height:auto;border-radius:16px;overflow:hidden;
    border:2px solid transparent;transition:border-color .2s, transform .2s, box-shadow .2s, background .2s;
    display:grid;place-items:center;
  }
  .pet-thumb img{max-width:86%;max-height:86%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(40,30,20,.14));}
  .pet-card:hover .pet-thumb{transform:translateY(-3px);box-shadow:0 8px 18px rgba(60,44,28,.10);}
  .pet-card.active .pet-thumb{border-color:var(--brand);box-shadow:0 0 0 4px rgba(255,107,69,.13);}
  .pet-card > span{font-size:11.5px;color:var(--ink-3);}
  .pet-card.active > span{color:var(--brand);font-weight:620;}
  .slot-index{
    position:absolute;top:5px;left:5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;
    display:grid;place-items:center;background:rgba(29,26,23,.72);color:#fff;
    font-size:9.5px;font-style:normal;font-weight:650;line-height:1;
  }
  .slot-remove{
    position:absolute;top:5px;right:5px;z-index:3;width:22px;height:22px;padding:0;border:0;border-radius:50%;
    display:grid;place-items:center;background:rgba(255,255,255,.94);color:#7d746a;
    font-family:inherit;font-size:16px;font-weight:500;line-height:1;cursor:pointer;
    box-shadow:0 3px 9px rgba(60,44,28,.16),0 0 0 1px rgba(29,26,23,.08);
    transition:background .18s,color .18s,transform .18s,box-shadow .18s;
  }
  .slot-remove:hover{background:#dc2626;color:#fff;transform:scale(1.08);box-shadow:0 5px 12px rgba(220,38,38,.28);}
  .slot-remove:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  .pet-card.empty .pet-thumb{
    border:1.6px dashed rgba(29,26,23,.20);
    background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,250,247,.38));
  }
  .pet-card.empty:hover .pet-thumb{
    border-color:var(--brand);background:rgba(255,107,69,.055);
    box-shadow:0 8px 18px rgba(255,107,69,.10);
  }
  .slot-plus{font-size:25px;font-weight:300;line-height:1;color:var(--brand);}
  .pet-card.empty:hover > span{color:var(--brand);}
  @media (max-width:900px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr));}}
  @media (max-width:460px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));}}

  /* ---------- 宠物舞台 ---------- */
  .pet-stage{position:fixed;left:0;top:0;z-index:9990;pointer-events:none;will-change:transform;}
  .pet-stage.hidden{display:none;}
  .pet-inner{
    position:relative;transform:translate(-50%,-50%);
    filter:drop-shadow(0 16px 20px rgba(60,40,20,.22));
    transform-origin:52% 72%;
  }
  #petImg{
    display:block;height:160px;width:auto;
    transform-origin:center;
    user-select:none;-webkit-user-drag:none;
  }
  .pet-stage.leaving .pet-inner{animation:leave .44s cubic-bezier(.55,0,.8,.2) forwards;}
  @keyframes leave{
    to{transform:translate(-50%,-50%) translateY(-46px) scale(.15) rotate(24deg);opacity:0;}
  }
  .pet-inner.pop{animation:pop .58s cubic-bezier(.34,1.56,.64,1);}
  @keyframes pop{
    0%{transform:translate(-50%,-50%) scale(.1);opacity:0;}
    60%{opacity:1;}
    100%{transform:translate(-50%,-50%) scale(1);}
  }
  #petImg.pop{animation:popImg .55s cubic-bezier(.34,1.56,.64,1);}
  @keyframes popImg{
    0%{transform:scale(.22);opacity:0;}
    55%{opacity:1;}
    100%{transform:scale(1);}
  }

  /* ---------- 控制坞 ---------- */
  .dock{
    position:fixed;left:50%;bottom:26px;z-index:10000;
    width:min(560px,calc(100vw - 32px));
    transform:translate(-50%,160%);
    transition:transform .5s cubic-bezier(.2,.9,.25,1);
    background:rgba(255,255,255,.9);
    border:1px solid rgba(255,255,255,.9);
    border-radius:20px;
    box-shadow:0 18px 50px rgba(60,44,28,.16), 0 2px 8px rgba(60,44,28,.06);
    backdrop-filter:blur(26px);
    padding:12px;
    font-family:inherit;
  }
  .dock.show{transform:translate(-50%,0);}
  .dock-main{display:flex;align-items:center;gap:11px;}
  .dock-avatar{
    width:42px;height:42px;flex:0 0 auto;border-radius:13px;border:0;cursor:pointer;
    background:#f4f0ea;display:grid;place-items:center;overflow:hidden;padding:4px;
    transition:transform .2s;
  }
  .dock-avatar:hover{transform:scale(1.06);}
  .dock-avatar img{max-width:100%;max-height:100%;object-fit:contain;}
  .dock-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .dock-text strong{font-size:13px;font-weight:660;}
  .dock-text span{font-size:11.5px;color:var(--ink-3);}
  .dock-panel{display:none;}
  .dock-panel.open{
    display:block;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
    animation:panelIn .3s cubic-bezier(.2,.9,.25,1) both;
  }
  @keyframes panelIn{
    from{opacity:0;transform:translateY(-8px);}
    to{opacity:1;transform:none;}
  }
  .mini-gallery{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
  .mini-thumb{
    width:52px;height:52px;border-radius:12px;border:2px solid transparent;background:#f4f0ea;
    cursor:pointer;padding:3px;display:grid;place-items:center;transition:border-color .2s;
  }
  .mini-thumb img{max-width:100%;max-height:100%;object-fit:contain;}
  .mini-thumb.active{border-color:var(--brand);}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;top:26px;z-index:10010;
    transform:translate(-50%,-24px);opacity:0;pointer-events:none;
    background:rgba(29,26,23,.92);color:#fff;
    padding:11px 20px;border-radius:12px;font-size:13px;font-weight:550;
    transition:opacity .26s, transform .26s;
    box-shadow:0 12px 30px rgba(0,0,0,.2);
    max-width:calc(100vw - 40px);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  .foot-note{
    text-align:center;font-size:11.5px;color:var(--ink-3);
    padding:18px 20px 26px;line-height:1.8;position:relative;z-index:2;
    flex:0 0 auto;
  }
  .foot-note kbd{
    background:rgba(29,26,23,.06);border-radius:5px;padding:1px 6px;
    font-family:inherit;font-size:11px;color:var(--ink-2);
  }
  @media (max-width:640px){
    .topbar,.wrap{padding-left:16px;padding-right:16px;}
    .card{padding:18px;}
    .dropzone{padding:40px 16px;}
  }
</style>
</head>
<body>

<div class="bg-fx">
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <span class="orb orb-3"></span>
</div>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 13.2c-2.7 0-5.3 3.2-5.3 5.4 0 1.4 1.1 2.3 2.5 2.3 1 0 1.8-.5 2.8-.5s1.8.5 2.8.5c1.4 0 2.5-.9 2.5-2.3 0-2.2-2.6-5.4-5.3-5.4Z"/>
        <ellipse cx="6.1" cy="11.6" rx="1.85" ry="2.45"/>
        <ellipse cx="17.9" cy="11.6" rx="1.85" ry="2.45"/>
        <ellipse cx="9.4" cy="7.5" rx="1.65" ry="2.15"/>
        <ellipse cx="14.6" cy="7.5" rx="1.65" ry="2.15"/>
      </svg>
    </div>
    <div>
      <h1>桌面宠物工坊</h1>
      <p>上传一张照片，把它变成跟着鼠标跑的小家伙</p>
    </div>
  </div>
  <div class="chip"><span class="dot" id="statusDot"></span><span id="statusText">等待上传</span></div>
</header>

<main class="wrap">

  <section class="card" id="uploadCard">
    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="上传图片">
      <div class="dz-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v2.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V16"/>
        </svg>
      </div>
      <div class="dz-title">拖入图片，或点击选择文件</div>
      <div class="dz-sub">支持 JPG / PNG / WEBP · 建议背景干净、主体清晰</div>
    </div>
  </section>

  <section class="steps" id="steps">
    <div class="step">
      <span class="step-no">01</span>
      <h3>上传照片</h3>
      <p>人物、宠物、玩偶都行，背景越干净抠得越准</p>
    </div>
    <div class="step">
      <span class="step-no">02</span>
      <h3>自动抠图</h3>
      <p>本机识别主体并移除背景，边缘可实时微调</p>
    </div>
    <div class="step">
      <span class="step-no">03</span>
      <h3>召唤跟随</h3>
      <p>宠物跟着鼠标跑，大小形象随手换，一键取消</p>
    </div>
  </section>

  <section class="card" id="editorCard" hidden>
    <div class="editor-grid">
      <div class="preview-col">
        <div class="preview-wrap checker">

<script>
(() => {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const nextFrame = () => new Promise(r => setTimeout(r, 24));
  const MAX_PET_SLOTS = 6;

  /* =========================================================
     运行环境：浏览器 / Electron 桌面版
     - 浏览器里宠物画在页面内
     - 桌面版把形象交给全屏透明叠加层，浮在系统桌面之上跟随鼠标
     ========================================================= */
  const DP = window.desktopPet || null;
  const ON_DESKTOP = !!(DP && DP.enabled);

  /* =========================================================
     状态
     ========================================================= */
  const state = {
    sourceImg: null,
    matteCanvas: null,
    matteURL: '',
    stats: null,
    localMatteCanvas: null,
    localMatteURL: '',
    localStats: null,
    pets: [],
    activeId: null,
    petOn: false,
    pet: { size: 160, hue: 0, flip: false },
    userTouched: false,
    aiBusy: false,
    aiReady: false,
    aiFailed: false,
    aiRejected: false,
    opts: { tolerance: 30, feather: 2 },
    seq: 0
  };

  /* =========================================================
     抠图引擎（纯本地）
     思路：边框颜色聚类 -> 泛洪填充背景 -> 连通域挑主体 -> 羽化
     ========================================================= */
  const MAX_SIDE = 820;

  function kmeans(samples, k, iters) {
    if (!samples.length) return [];
    k = Math.min(k, samples.length);
    let centers = [];
    for (let i = 0; i < k; i++) centers.push(samples[Math.floor(samples.length * i / k)].slice());
    for (let it = 0; it < iters; it++) {
      const sr = new Float64Array(k), sg = new Float64Array(k), sb = new Float64Array(k), n = new Float64Array(k);
      for (let i = 0; i < samples.length; i++) {
        const s = samples[i];
        let bi = 0, bd = Infinity;
        for (let j = 0; j < k; j++) {
          const c = centers[j];
          const dr = s[0] - c[0], dg = s[1] - c[1], db = s[2] - c[2];
          const d = dr * dr + dg * dg + db * db;
          if (d < bd) { bd = d; bi = j; }
        }
        sr[bi] += s[0]; sg[bi] += s[1]; sb[bi] += s[2]; n[bi]++;
      }
      for (let j = 0; j < k; j++) {
        if (n[j] > 0) centers[j] = [sr[j] / n[j], sg[j] / n[j], sb[j] / n[j]];
      }
    }
    return centers;
  }

  function boxBlur(src, W, H, r) {
    if (r <= 0) return src;
    const tmp = new Float32Array(W * H);
    const out = new Float32Array(W * H);
    const win = 2 * r + 1;
    // 水平
    for (let y = 0; y < H; y++) {
      const row = y * W;
      let sum = 0;
      for (let i = -r; i <= r; i++) sum += src[row + clamp(i, 0, W - 1)];
      for (let x = 0; x < W; x++) {
        tmp[row + x] = sum / win;
        const add = row + clamp(x + r + 1, 0, W - 1);
        const rem = row + clamp(x - r, 0, W - 1);
        sum += src[add] - src[rem];
      }
    }
    // 垂直
    for (let x = 0; x < W; x++) {
      let sum = 0;
      for (let i = -r; i <= r; i++) sum += tmp[clamp(i, 0, H - 1) * W + x];
      for (let y = 0; y < H; y++) {
        out[y * W + x] = sum / win;
        const add = clamp(y + r + 1, 0, H - 1) * W + x;
        const rem = clamp(y - r, 0, H - 1) * W + x;
        sum += tmp[add] - tmp[rem];
      }
    }
    return out;
  }

  // 深色服装上的白色蕾丝、浅色细节经常被当成“背景通道”漏进去，
  // 最终在主体内部留下破洞。这里先做一次轻量形态学闭运算封住细缝，
  // 再只填补被前景包围的小面积透明区域，保留真正的手臂/腿间空隙。
  function fillAlphaHoles(alpha, W, H) {
    const N = W * H;
    const fg = new Uint8Array(N);
    let fgArea = 0;
    for (let p = 0; p < N; p++) {
      if (alpha[p] > 0.24) { fg[p] = 1; fgArea++; }
    }
    if (!fgArea) return { holes: 0, pixels: 0 };

    const radius = clamp(Math.round(Math.min(W, H) * 0.0045), 2, 4);
    const morph = (src, expand) => {
      const out = new Uint8Array(N);
      for (let y = 0; y < H; y++) {
        const row = y * W;
        for (let x = 0; x < W; x++) {
          const p = row + x;
          let hit = expand ? 0 : 1;
          if (expand) {
            if (src[p] || (x > 0 && src[p - 1]) || (x < W - 1 && src[p + 1]) ||
                (y > 0 && src[p - W]) || (y < H - 1 && src[p + W])) hit = 1;
          } else {
            if (!src[p] || (x > 0 && !src[p - 1]) || (x < W - 1 && !src[p + 1]) ||
                (y > 0 && !src[p - W]) || (y < H - 1 && !src[p + W])) hit = 0;
          }
          out[p] = hit;
        }
      }
      return out;
    };

    let closed = fg;
    for (let i = 0; i < radius; i++) closed = morph(closed, true);
    for (let i = 0; i < radius; i++) closed = morph(closed, false);

    const seen = new Uint8Array(N);
    const queue = new Int32Array(N);
    const maxHole = Math.max(24, fgArea * 0.18);
    let holes = 0, pixels = 0;

    for (let start = 0; start < N; start++) {
      if (closed[start] || seen[start]) continue;
      let head = 0, tail = 0;
      queue[tail++] = start;
      seen[start] = 1;
      let touchesBorder = false;
      while (head < tail) {
        const p = queue[head++];
        const x = p % W;
        const y = (p - x) / W;
        if (x === 0 || y === 0 || x === W - 1 || y === H - 1) touchesBorder = true;
        let n;
        if (x > 0) { n = p - 1; if (!closed[n] && !seen[n]) { seen[n] = 1; queue[tail++] = n; } }
        if (x < W - 1) { n = p + 1; if (!closed[n] && !seen[n]) { seen[n] = 1; queue[tail++] = n; } }
        if (y > 0) { n = p - W; if (!closed[n] && !seen[n]) { seen[n] = 1; queue[tail++] = n; } }
        if (y < H - 1) { n = p + W; if (!closed[n] && !seen[n]) { seen[n] = 1; queue[tail++] = n; } }
      }
      if (!touchesBorder && tail >= 3 && tail <= maxHole) {
        holes++;
        pixels += tail;
        for (let i = 0; i < tail; i++) alpha[queue[i]] = 1;
      }
    }
    return { holes, pixels };
  }

  // 纯算法核心：输入 RGBA 像素缓冲区，输出每像素 alpha（0..1）与统计
  function computeAlpha(d, W, H, opts) {
    const N = W * H;

    // ---- 1. 边框采样 + 背景色聚类 ----
    const band = Math.max(1, Math.round(Math.min(W, H) * 0.012));
    const samples = [];
    const samplePos = [];
    const stride = Math.max(1, Math.floor(((W + H) * 2 * band) / 1100));
    let counter = 0;
    const sampleAt = (x, y) => {
      if (counter++ % stride) return;
      const p = (y * W + x) * 4;
      if (d[p + 3] < 10) return;
      samples.push([d[p], d[p + 1], d[p + 2]]);
      samplePos.push([x, y]);
    };
    for (let x = 0; x < W; x++) for (let y = 0; y < band; y++) { sampleAt(x, y); sampleAt(x, H - 1 - y); }
    for (let y = 0; y < H; y++) for (let x = 0; x < band; x++) { sampleAt(x, y); sampleAt(W - 1 - x, y); }

    let centers = samples.length ? kmeans(samples, 3, 7) : [];

    // 边框里可能混进主体颜色：人物站到照片下沿（或身体贴边）时，
    // 这些像素会被采成"背景色"，泛洪随即把整个身体当背景吃掉。
    // 判据：与主簇色差大 + 占边框比例不高 + 该颜色从边框向内延伸很深。
    // 真正的地板/墙裙条带很浅，会被保留并正常移除。
    if (centers.length > 1 && samples.length) {
      const near = (r, g, b, c) => {
        const dr = r - c[0], dg = g - c[1], db = b - c[2];
        return (2 * dr * dr + 4 * dg * dg + 3 * db * db) / 9;
      };
      const k = centers.length;
      const cnt = new Array(k).fill(0);
      for (let i = 0; i < samples.length; i++) {
        const sm = samples[i];
        let bi = 0, bd = Infinity;
        for (let j = 0; j < k; j++) {
          const dd = near(sm[0], sm[1], sm[2], centers[j]);
          if (dd < bd) { bd = dd; bi = j; }
        }
        cnt[bi]++;
      }
      let dom = 0;
      for (let j = 1; j < k; j++) if (cnt[j] > cnt[dom]) dom = j;
      const total = Math.max(1, samples.length);
      const maxDepth = Math.round(Math.min(W, H) * 0.45);

      // 从某个边框样本出发，沿垂直方向向画面内部走，看这个颜色能延伸多深
      const depthFrom = (c, x, y) => {
        let dx = 0, dy = 0;
        if (y <= band) dy = 1;
        else if (y >= H - 1 - band) dy = -1;
        else if (x <= band) dx = 1;
        else dx = -1;
        let depth = 0, cx2 = x, cy2 = y;
        while (depth < maxDepth) {
          cx2 += dx; cy2 += dy;
          if (cx2 < 0 || cy2 < 0 || cx2 >= W || cy2 >= H) break;
          const q = (cy2 * W + cx2) * 4;
          if (d[q + 3] < 10) break;
          if (near(d[q], d[q + 1], d[q + 2], c) > 420) break;  // 色差 > 约 20 就换色了
          depth++;
        }
        return depth;
      };

      const medDepth = (c) => {
        const ds = [];
        // 注意：这里必须全量遍历。采样序列里同一侧边框的样本下标同奇偶，
        // 若再套一层偶数步长会整段跳过（曾经因此一个样本都取不到）。
        for (let i = 0; i < samplePos.length; i++) {
          const sm = samples[i];
          if (near(sm[0], sm[1], sm[2], c) > 420) continue;
          ds.push(depthFrom(c, samplePos[i][0], samplePos[i][1]));
          if (ds.length >= 48) break;
        }
        if (!ds.length) return 0;
        ds.sort((a, b) => a - b);
        return ds[Math.floor(ds.length / 2)];
      };

      centers = centers.filter((c, j) => {
        if (j === dom) return true;                       // 主簇一定是背景
        if (cnt[j] / total >= 0.35) return true;          // 占边框太多，更像背景本体
        if (Math.sqrt(near(c[0], c[1], c[2], centers[dom])) <= 36) return true;  // 渐变背景，保留
        return medDepth(c) < Math.min(W, H) * 0.18;       // 延伸很深 → 是主体，剔除
      });
      if (!centers.length) centers = [kmeans(samples, 1, 4)[0] || samples[0]];
    }

    // ---- 2. 自适应阈值 ----
    const dist2 = (r, g, b, c) => {
      const dr = r - c[0], dg = g - c[1], db = b - c[2];
      return (2 * dr * dr + 4 * dg * dg + 3 * db * db) / 9;
    };
    const minGlob = (r, g, b) => {
      let m = Infinity;
      for (let i = 0; i < centers.length; i++) {
        const dd = dist2(r, g, b, centers[i]);
        if (dd < m) m = dd;
      }
      return m;
    };

    // 背景越不均匀（渐变、噪点），需要的容差越大；
    // 均匀背景则收紧，避免把浅色皮肤、浅色衣物当成背景吃掉。
    let autoTol = 16;
    if (centers.length && samples.length) {
      let s1 = 0, s2 = 0;
      for (let i = 0; i < samples.length; i++) {
        const s = samples[i];
        const dm = Math.sqrt(minGlob(s[0], s[1], s[2]));
        s1 += dm; s2 += dm * dm;
      }
      const mean = s1 / samples.length;
      const sd = Math.sqrt(Math.max(0, s2 / samples.length - mean * mean));
      autoTol = mean + 2 * sd + 8;
    }
    autoTol = clamp(autoTol, 12, 72);
    // 滑块作为倍率：默认偏保守，手动加大才会更激进地吃背景
    const tol = clamp(autoTol * (0.42 + opts.tolerance / 100 * 2.2), 8, 130);
    const globTol2 = tol * tol;
    const localTol2 = (tol * 0.8) * (tol * 0.8);

    // 背景若是低饱和（灰、白、黑底），彩色像素几乎一定属于主体：
    // 灰底人像里肤色与背景亮度接近，只靠 RGB 距离会把脸一起删掉。
    const chromaOf = (r, g, b) => Math.max(r, g, b) - Math.min(r, g, b);
    let bgChromaMax = 0;
    for (let i = 0; i < centers.length; i++) {
      bgChromaMax = Math.max(bgChromaMax, chromaOf(centers[i][0], centers[i][1], centers[i][2]));
    }
    const lowSatBg = centers.length > 0 && bgChromaMax < 20;
    const chromaGuard = lowSatBg ? 34 : Infinity;

    // ---- 3. 从边框向内泛洪，标记背景 ----
    const bg = new Uint8Array(N); // 1 = 背景
    const queue = new Int32Array(N);
    let qh = 0, qt = 0;

    const push = (p) => { if (qt < N) { bg[p] = 1; queue[qt++] = p; } };

    const seed = (x, y) => {
      const p = y * W + x;
      if (bg[p]) return;
      const i = p * 4;
      if (d[i + 3] < 10) { push(p); return; }
      if (centers.length && minGlob(d[i], d[i + 1], d[i + 2]) <= globTol2) push(p);
    };
    for (let x = 0; x < W; x++) for (let y = 0; y < band; y++) { seed(x, y); seed(x, H - 1 - y); }
    for (let y = 0; y < H; y++) for (let x = 0; x < band; x++) { seed(x, y); seed(W - 1 - x, y); }

    const grow = (n, pr, pg, pb) => {
      if (bg[n]) return;
      const i = n * 4;
      const r = d[i], g = d[i + 1], b = d[i + 2];
      if (d[i + 3] < 10) { push(n); return; }
      if (chromaOf(r, g, b) > chromaGuard) return; // 彩色主体保护
      const dr = r - pr, dg = g - pg, db = b - pb;
      const local2 = (2 * dr * dr + 4 * dg * dg + 3 * db * db) / 9;
      // 必须同时满足：与相邻背景像素接近，且整体仍像背景色。
      // 后者用于阻止泛洪沿抗锯齿的渐变边缘"爬"进主体。
      const okGlob = centers.length === 0 || minGlob(r, g, b) <= globTol2 * 2.25;
      if (local2 <= localTol2 && okGlob) push(n);
    };

    while (qh < qt) {
      const p = queue[qh++];
      const x = p % W;
      const y = (p - x) / W;
      const i = p * 4;
      const pr = d[i], pg = d[i + 1], pb = d[i + 2];
      if (x > 0) grow(p - 1, pr, pg, pb);
      if (x < W - 1) grow(p + 1, pr, pg, pb);
      if (y > 0) grow(p - W, pr, pg, pb);
      if (y < H - 1) grow(p + W, pr, pg, pb);
    }

    // ---- 4. 连通域：只保留主要主体 ----
    const comp = new Int32Array(N);
    const areas = [0];
    const q2 = new Int32Array(N);
    let cid = 0, maxArea = 0;
    for (let p = 0; p < N; p++) {
      if (bg[p] || comp[p]) continue;
      cid++;
      let h = 0, t = 0;
      q2[t++] = p; comp[p] = cid;
      let area = 0;
      while (h < t) {
        const q = q2[h++];
        area++;
        const x = q % W;
        const y = (q - x) / W;
        let n;
        if (x > 0) { n = q - 1; if (!bg[n] && !comp[n]) { comp[n] = cid; q2[t++] = n; } }
        if (x < W - 1) { n = q + 1; if (!bg[n] && !comp[n]) { comp[n] = cid; q2[t++] = n; } }
        if (y > 0) { n = q - W; if (!bg[n] && !comp[n]) { comp[n] = cid; q2[t++] = n; } }
        if (y < H - 1) { n = q + W; if (!bg[n] && !comp[n]) { comp[n] = cid; q2[t++] = n; } }
      }
      areas[cid] = area;
      if (area > maxArea) maxArea = area;
    }

    const keep = new Uint8Array(cid + 1);
    if (maxArea > 0) {
      // 只保留足够大的连通区域：最大主体 + 与其面积可比的部件（如手、道具）
      const minArea = Math.max(maxArea * 0.2, N * 0.0006);
      for (let i = 1; i <= cid; i++) keep[i] = areas[i] >= minArea ? 1 : 0;
    }

    // ---- 5. 生成 alpha 并羽化边缘 ----
    let alpha = new Float32Array(N);
    for (let p = 0; p < N; p++) {
      alpha[p] = (!bg[p] && comp[p] && keep[comp[p]]) ? 1 : 0;
    }
    if (maxArea === 0) alpha.fill(1); // 兜底：完全没识别出主体时保留整图

    const holeFix = fillAlphaHoles(alpha, W, H);
    alpha = boxBlur(alpha, W, H, opts.feather);
    alpha = boxBlur(alpha, W, H, Math.max(0, opts.feather - 1));

    let bgCount = 0, keepCount = 0, fgCount = 0;
    for (let p = 0; p < N; p++) {
      if (bg[p]) bgCount++;
      if (alpha[p] > 0.5) fgCount++;
    }
    for (let i = 1; i <= cid; i++) keepCount += keep[i];

    return {
      alpha, centers, tol, band,
      cid, maxArea, keepCount, bgCount,
      fgCount, fgRatio: fgCount / N,
      holesFilled: holeFix.holes,
      holePixels: holeFix.pixels,
      areasTop: areas.slice().sort((a, b) => b - a).slice(0, 6)
    };
  }

  function matte(img, opts) {
    const t0 = performance.now();
    const sw0 = img.naturalWidth || img.width;
    const sh0 = img.naturalHeight || img.height;
    const sc = Math.min(1, MAX_SIDE / Math.max(sw0, sh0));
    const W = Math.max(2, Math.round(sw0 * sc));
    const H = Math.max(2, Math.round(sh0 * sc));

    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.clearRect(0, 0, W, H);
    cx.drawImage(img, 0, 0, W, H);
    const idata = cx.getImageData(0, 0, W, H);
    const d = idata.data;
    const N = W * H;

    const res = computeAlpha(d, W, H, opts);

    for (let p = 0; p < N; p++) {
      d[p * 4 + 3] = Math.round(clamp(res.alpha[p], 0, 1) * d[p * 4 + 3]);
    }
    cx.putImageData(idata, 0, 0);

    // ---- 裁剪到内容边界 ----
    let minX = W, minY = H, maxX = -1, maxY = -1;
    for (let y = 0; y < H; y++) {
      const row = y * W;
      for (let x = 0; x < W; x++) {
        if (d[(row + x) * 4 + 3] > 14) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }

    const outCv = document.createElement('canvas');
    if (maxX < 0) {
      outCv.width = W; outCv.height = H;
      outCv.getContext('2d').drawImage(cv, 0, 0);
    } else {
      const pad = Math.round(Math.max(W, H) * 0.012);
      const bx = Math.max(0, minX - pad);
      const by = Math.max(0, minY - pad);
      const bw = Math.min(W, maxX + 1 + pad) - bx;
      const bh = Math.min(H, maxY + 1 + pad) - by;
      outCv.width = Math.max(2, bw);
      outCv.height = Math.max(2, bh);
      outCv.getContext('2d').drawImage(cv, bx, by, bw, bh, 0, 0, bw, bh);
    }

    return {
      canvas: outCv,
      width: outCv.width,
      height: outCv.height,
      bgRatio: res.bgCount / N,
      fgRatio: res.fgRatio,
      fgCount: res.fgCount,
      holesFilled: res.holesFilled,
      holePixels: res.holePixels,
      ms: performance.now() - t0
    };
  }

  /* =========================================================
     图片加载
     ========================================================= */
  function loadImageFile(file) {
    return new Promise((resolve, reject) => {
      if (!file || !file.type || !file.type.startsWith('image/')) {
        reject(new Error('不是图片文件'));
        return;
      }
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片解码失败')); };
      img.src = url;
    });
  }

  function loadImageURL(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('加载失败'));
      img.src = url;
    });
  }

  /* =========================================================
     抠图流程
     ========================================================= */
  let recomputeTimer = null;

  function scheduleRecompute() {

  }

  async function runMatte() {
    if (!state.sourceImg) return;
    processing.classList.add('show');
    processingText.textContent = '识别主体中…';
    setStatus('识别主体中…', true);
    await nextFrame();

    try {
      const res = matte(state.sourceImg, state.opts);
      state.localMatteCanvas = res.canvas;
      state.localMatteURL = res.canvas.toDataURL('image/png');
      state.localStats = res;
      state.matteCanvas = res.canvas;
      state.matteURL = state.localMatteURL;
      state.stats = res;
      state.aiReady = false;
      previewImg.src = state.matteURL;

      const pct = Math.round(res.bgRatio * 100);
      previewMeta.innerHTML =
        `<span>输出 <b>${res.width}×${res.height}</b></span>` +
        `<span>移除背景 <b>${pct}%</b></span>` +
        `<span>耗时 <b>${Math.round(res.ms)}ms</b></span>`;

      if (pct < 6) {
        previewMeta.innerHTML += `<span style="color:#dc2626">背景几乎没被移除，试试调高容差</span>`;
      }
      if (res.holesFilled) {
        previewMeta.innerHTML += `<span>修复内部空洞 <b>${res.holesFilled}</b> 处</span>`;
      }
      setStatus('抠图完成', false);
    } catch (err) {
      console.error(err);
      toast('抠图失败：' + err.message);
      setStatus('抠图失败', false);
    } finally {
      processing.classList.remove('show');
    }
  }

  async function handleFile(file) {
    if (!file) return;
    if (isGalleryFull()) { toast('形象库已满，最多保留 6 个形象'); return; }
    setStatus('读取图片…', true);
    try {
      const img = await loadImageFile(file);
      state.sourceImg = img;
      state.userTouched = false;
      state.aiReady = false;
      state.aiFailed = false;
      state.aiRejected = false;
      uploadCard.hidden = true;
      $('#steps').hidden = true;
      editorCard.hidden = false;
      editorCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      await runMatte();
      // AI 对动漫/白发/浅色服装容易漏检，默认保留可用的本地结果；AI 由用户手动触发。
    } catch (err) {
      toast(err.message || '图片读取失败');

    }

  /* =========================================================
     AI 分割（可选增强，按需加载）
     ========================================================= */
  let aiSegmenter = null;

  // 多 CDN 回退：不同网络环境下总有可达的一个
  const AI_CDN = [
    'https://unpkg.com/@mediapipe/tasks-vision@0.10.14',
    'https://fastly.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14'
  ];

  const withTimeout = (p, ms) => Promise.race([
    p,
    new Promise((_, rej) => setTimeout(() => rej(new Error('加载超时')), ms))
  ]);

  async function loadAISegmenter() {
    if (aiSegmenter) return aiSegmenter;
    let lastErr = null;
    for (const base of AI_CDN) {
      try {
        const vision = await withTimeout(import(/* @vite-ignore */ base), 15000);
        const fileset = await withTimeout(vision.FilesetResolver.forVisionTasks(base + '/wasm'), 15000);
        aiSegmenter = await withTimeout(vision.ImageSegmenter.createFromOptions(fileset, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/image_segmenter/deeplab_v3/float32/1/deeplab_v3.tflite',
            delegate: 'GPU'
          },
          runningMode: 'IMAGE',
          outputCategoryMask: true,
          outputConfidenceMasks: false
        }), 30000);
        return aiSegmenter;
      } catch (e) {
        lastErr = e;
        console.warn('AI 模型加载失败，尝试下一个源：', base, e);
      }
    }
    throw lastErr || new Error('无法加载 AI 模型');
  }

  function aiMaskLooksTruncated(aiRatio, localRatio) {
    if (!Number.isFinite(aiRatio) || !Number.isFinite(localRatio)) return false;
    // 本地抠图几乎没去掉背景时，不应阻止 AI 尝试；
    // 本地轮廓正常、AI 却只保留明显更少的主体时，判定为 AI 漏检。
    if (localRatio < 0.06 || localRatio > 0.92) return false;
    return aiRatio < localRatio * 0.75;
  }

  function restoreLocalMatte(note) {
    if (!state.localMatteURL || !state.localStats) return;
    const res = state.localStats;
    state.matteCanvas = state.localMatteCanvas;
    state.matteURL = state.localMatteURL;
    state.stats = res;
    previewImg.src = state.localMatteURL;
    const pct = Math.round((res.bgRatio || 0) * 100);
    previewMeta.innerHTML =
      `<span>输出 <b>${res.width}×${res.height}</b></span>` +
      `<span>移除背景 <b>${pct}%</b></span>` +
      `<span style="color:#dc2626">${note}</span>`;
  }

  async function applyAI(opt) {
    const silent = !!(opt && opt.silent);
    if (!state.sourceImg || state.aiBusy) return false;
    state.aiBusy = true;
    const btn = $('#aiBtn');
    btn.disabled = true;
    if (!silent) {
      processing.classList.add('show');
      processingText.textContent = '加载 AI 模型…';
    }
    setStatus('加载 AI 模型…', true);

    try {
      const seg = await loadAISegmenter();
      processingText.textContent = 'AI 分割中…';
      await nextFrame();

      // 以较短边 512 作为模型输入
      const sw0 = state.sourceImg.naturalWidth;
      const sh0 = state.sourceImg.naturalHeight;
      const sc = Math.min(1, 512 / Math.max(sw0, sh0));
      const W = Math.round(sw0 * sc), H = Math.round(sh0 * sc);

      const src = document.createElement('canvas');
      src.width = W; src.height = H;
      src.getContext('2d').drawImage(state.sourceImg, 0, 0, W, H);

      const result = seg.segment(src);
      const mask = result.categoryMask;
      if (!mask) throw new Error('模型未返回分割结果');
      const mw = mask.width, mh = mask.height;
      const cats = mask.getAsUint8Array();

      // Pascal VOC 中 person = 15
      const maskCv = document.createElement('canvas');
      maskCv.width = mw; maskCv.height = mh;
      const mctx = maskCv.getContext('2d');
      const mid = mctx.createImageData(mw, mh);
      const md = mid.data;
      const aiAlpha = new Float32Array(mw * mh);
      let personCount = 0;
      for (let i = 0; i < mw * mh; i++) {
        const isPerson = cats[i] === 15;
        if (isPerson) personCount++;
        aiAlpha[i] = isPerson ? 1 : 0;
      }
      fillAlphaHoles(aiAlpha, mw, mh);
      for (let i = 0; i < mw * mh; i++) {
        md[i * 4] = 255; md[i * 4 + 1] = 255; md[i * 4 + 2] = 255;
        md[i * 4 + 3] = aiAlpha[i] > 0.5 ? 255 : 0;
      }
      mctx.putImageData(mid, 0, 0);
      mask.close();
      if (result.close) result.close();

      if (personCount < mw * mh * 0.006) throw new Error('没有检测到人物');

      const aiRatio = personCount / (mw * mh);
      const localRatio = state.localStats ? state.localStats.fgRatio : 0;
      if (aiMaskLooksTruncated(aiRatio, localRatio)) {
        const err = new Error('AI 识别不完整');
        err.code = 'AI_UNDERSEGMENTED';
        throw err;
      }

      // 合成：用放大的 mask alpha 做 destination-in（缩放插值自带羽化）
      const out = document.createElement('canvas');
      out.width = W; out.height = H;
      const octx = out.getContext('2d');
      octx.drawImage(src, 0, 0);
      octx.globalCompositeOperation = 'destination-in';
      octx.drawImage(maskCv, 0, 0, W, H);
      octx.globalCompositeOperation = 'source-over';

      // 裁剪
      const cropped = cropToAlpha(out);
      state.matteCanvas = cropped;
      state.matteURL = cropped.toDataURL('image/png');
      previewImg.src = state.matteURL;
      previewMeta.innerHTML =
        `<span>输出 <b>${cropped.width}×${cropped.height}</b></span>` +
        `<span>AI 人物分割 <b>完成</b></span>`;
      state.aiReady = true;
      state.aiRejected = false;
      setStatus('AI 抠图完成', false);
      if (!silent) toast('AI 抠图完成');
      return true;
    } catch (err) {
      console.warn(err);
      if (err && err.code === 'AI_UNDERSEGMENTED') {
        state.aiReady = false;
        state.aiFailed = true;
        state.aiRejected = true;
        restoreLocalMatte('AI 结果不完整，已保留本地抠图');
        setStatus('已保留本地抠图', false);
        if (!silent) toast('AI 识别不完整，已保留更完整的本地抠图');
        return false;
      }
      if (silent) state.aiFailed = true;
      if (!silent) toast('AI 抠图不可用，请继续用本地抠图');
      setStatus('抠图完成', false);
      return false;
    } finally {
      processing.classList.remove('show');
      btn.disabled = false;
      state.aiBusy = false;
    }
  }

  function runAI() { return applyAI({ silent: false }); }


  function cropToAlpha(canvas) {
    const W = canvas.width, H = canvas.height;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const idata = ctx.getImageData(0, 0, W, H);
    const d = idata.data;
    let minX = W, minY = H, maxX = -1, maxY = -1;
    for (let y = 0; y < H; y++) {
      const row = y * W;
      for (let x = 0; x < W; x++) {
        if (d[(row + x) * 4 + 3] > 14) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return canvas;
    const pad = Math.round(Math.max(W, H) * 0.012);
    const bx = Math.max(0, minX - pad);
    const by = Math.max(0, minY - pad);
    const bw = Math.min(W, maxX + 1 + pad) - bx;
    const bh = Math.min(H, maxY + 1 + pad) - by;
    const out = document.createElement('canvas');
    out.width = Math.max(2, bw);
    out.height = Math.max(2, bh);
    out.getContext('2d').drawImage(canvas, bx, by, bw, bh, 0, 0, bw, bh);
    return out;
  }

  /* =========================================================
     宠物管理
     ========================================================= */
  function addPet(url, meta) {
    if (!url || isGalleryFull()) {
      toast('形象库已满，最多保留 6 个形象');
      return null;
    }
    state.seq++;
    const pet = {
      id: (meta && meta.id) || ('pet-' + state.seq),
      name: (meta && meta.name) || ('小家伙 ' + state.seq),
      url
    };
    state.pets.push(pet);
    state.activeId = pet.id;
    renderGalleries();
    return pet;
  }

  function currentPet() {
    return state.pets.find(p => p.id === state.activeId) || null;
  }

  function desktopStatePayload(extra) {
    return Object.assign({
      pets: state.pets.map(p => ({ id: p.id, name: p.name, url: p.url })),
      activeId: state.activeId,
      size: state.pet.size,
      hue: state.pet.hue,
      flip: state.pet.flip
    }, extra || {});
  }

  function removePet(id) {
    const index = state.pets.findIndex(p => p.id === id);
    if (index < 0) return;
    const removed = state.pets[index];
    const wasActive = removed.id === state.activeId;
    state.pets.splice(index, 1);

    if (!state.pets.length) {
      state.activeId = null;
      renderGalleries();
      if (state.petOn) dismissPet();
      else toast('已取消 ' + removed.name);
      return;
    }

    if (wasActive) {
      const next = state.pets[Math.min(index, state.pets.length - 1)];
      state.activeId = next.id;
      if (state.petOn) setActive(next.id, { pop: true });
      else renderGalleries();
      toast('已取消 ' + removed.name + ' · 现在由 ' + next.name + ' 领队');
    } else {
      renderGalleries();
      if (ON_DESKTOP && state.petOn) DP.update(desktopStatePayload());
      toast('已取消 ' + removed.name);
    }
  }

  function setActive(id, opt) {
    const pet = state.pets.find(p => p.id === id);
    if (!pet) return;
    state.activeId = id;
    dockName.textContent = pet.name;
    dockAvatarImg.src = pet.url;
    petImg.onload = () => {
      applyPetSize();
      if (opt && opt.pop) popPet();
    };
    petImg.src = pet.url;
    renderGalleries();

    // 桌面版运行中切换领队：所有形象仍会一起跟随
    if (ON_DESKTOP && state.petOn && !(opt && opt.skipDesktop)) {
      DP.update(desktopStatePayload());
    }
  }

  function popPet() {
    petImg.classList.remove('pop');
    void petImg.offsetWidth;
    petImg.classList.add('pop');
    setTimeout(() => petImg.classList.remove('pop'), 600);
  }

  function applyPetSize() {
    const h = state.pet.size;
    const ratio = (petImg.naturalWidth || 1) / (petImg.naturalHeight || 1);
    const maxW = Math.min(window.innerWidth * 0.55, 520);
    let w = h * ratio;
    let hh = h;
    if (w > maxW) { w = maxW; hh = w / ratio; }
    petImg.style.height = hh + 'px';
    petImg.style.width = w + 'px';
  }

  function startPet() {
    if (!state.activeId) return;
    clearTimeout(leaveTimer);
    state.petOn = true;
    dock.classList.add('show');
    setActive(state.activeId, { pop: !ON_DESKTOP, skipDesktop: true });

    // 桌面版：形象交给叠加层，盖上整个桌面，页面里不再显示宠物
    if (ON_DESKTOP) {
      petStage.classList.add('hidden');
      DP.summon(desktopStatePayload());
      setStatus('宠物已上桌面', false);
      toast('已召唤到桌面 · 所有形象会排成队伍跟随，按 Esc 收回');
      return;
    }

    petStage.classList.remove('hidden', 'leaving');
    mouse.x = window.innerWidth / 2;
    mouse.y = window.innerHeight / 2;
    pos.x = mouse.x; pos.y = mouse.y;
    petStage.style.transform = `translate3d(${pos.x}px, ${pos.y}px, 0)`;
    setStatus('宠物运行中', false);
    toast('宠物已召唤 · 移动鼠标试试');
  }

  let leaveTimer = null;
  function dismissPet() {
    if (!state.petOn) return;
    state.petOn = false;
    dock.classList.remove('show');
    dockPanel.classList.remove('open');

    // 桌面版：让叠加层收回宠物
    if (ON_DESKTOP) {
      DP.dismiss();
      setStatus('抠图完成', false);
      toast('已收回小家伙 · 随时可以再召唤');
      return;
    }

    petStage.classList.add('leaving');
    setStatus('抠图完成', false);
    clearTimeout(leaveTimer);
    leaveTimer = setTimeout(() => {
      petStage.classList.remove('leaving');
      petStage.classList.add('hidden');
    }, 460);
    toast('已收回小家伙 · 随时可以再召唤');
  }

  /* =========================================================
     渲染
     ========================================================= */
  function renderGalleries() {
    const count = state.pets.length;
    galleryCard.hidden = count === 0;
    slotCount.textContent = `${count} / ${MAX_PET_SLOTS}`;
    slotCount.classList.toggle('full', count >= MAX_PET_SLOTS);

    const addMoreBtn = $('#addMoreBtn');
    const uploadMoreBtn = $('#uploadMoreBtn');
    if (addMoreBtn) {
      addMoreBtn.disabled = isGalleryFull();
      addMoreBtn.textContent = isGalleryFull() ? '形象库已满' : '＋ 添加形象';
      addMoreBtn.title = isGalleryFull() ? '最多只能保留 6 个形象' : `添加第 ${count + 1} 个形象`;
    }
    if (uploadMoreBtn) {
      uploadMoreBtn.disabled = isGalleryFull();
      uploadMoreBtn.textContent = isGalleryFull() ? '形象库已满' : '添加新形象';
    }

    // 主形象库：固定六个槽位，已有形象按生成顺序占位
    gallery.innerHTML = '';
    state.pets.forEach((p, index) => {
      const btn = document.createElement('button');
      btn.className = 'pet-card' + (p.id === state.activeId ? ' active' : '');
      btn.type = 'button';
      btn.title = `${p.name} · 槽位 ${index + 1}`;
      const thumb = document.createElement('div');
      thumb.className = 'pet-thumb checker';
      const im = document.createElement('img');
      im.src = p.url; im.alt = p.name;
      const badge = document.createElement('i');
      badge.className = 'slot-index';
      badge.textContent = index + 1;
      thumb.appendChild(im);
      thumb.appendChild(badge);
      const label = document.createElement('span');
      label.textContent = p.name;
      btn.appendChild(thumb);
      btn.appendChild(label);
      btn.addEventListener('click', () => {
        if (!state.petOn) { setActive(p.id); startPet(); }
        else { setActive(p.id, { pop: true }); toast('已切换为 ' + p.name); }
      });
      const slotWrap = document.createElement('div');
      slotWrap.className = 'pet-slot';
      const removeBtn = document.createElement('button');
      removeBtn.className = 'slot-remove';
      removeBtn.type = 'button';
      removeBtn.textContent = '×';
      removeBtn.title = '取消 ' + p.name;
      removeBtn.setAttribute('aria-label', '取消 ' + p.name);
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        removePet(p.id);
      });
      slotWrap.appendChild(btn);
      slotWrap.appendChild(removeBtn);
      gallery.appendChild(slotWrap);
    });

    for (let slot = count; slot < MAX_PET_SLOTS; slot++) {
      const btn = document.createElement('button');
      btn.className = 'pet-card empty';
      btn.type = 'button';
      btn.title = `添加第 ${slot + 1} 个形象`;
      const thumb = document.createElement('div');
      thumb.className = 'pet-thumb';
      const badge = document.createElement('i');
      badge.className = 'slot-index';
      badge.textContent = slot + 1;
      const plus = document.createElement('span');
      plus.className = 'slot-plus';
      plus.textContent = '+';
      thumb.appendChild(badge);
      thumb.appendChild(plus);
      const label = document.createElement('span');
      label.textContent = '添加形象';
      btn.appendChild(thumb);
      btn.appendChild(label);
      btn.addEventListener('click', openFilePicker);
      gallery.appendChild(btn);
    }

    // 控制坞缩略图
    miniGallery.innerHTML = '';
    state.pets.forEach((p, index) => {
      const b = document.createElement('button');
      b.className = 'mini-thumb' + (p.id === state.activeId ? ' active' : '');
      b.type = 'button';
      b.title = `${p.name} · 槽位 ${index + 1}`;
      const im = document.createElement('img');
      im.src = p.url; im.alt = p.name;
      b.appendChild(im);
      b.addEventListener('click', () => setActive(p.id, { pop: true }));
      miniGallery.appendChild(b);
    });
  }
  /* =========================================================
     跟随动画
     ========================================================= */
  const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  const pos = { x: mouse.x, y: mouse.y };
  const vel = { x: 0, y: 0 };
  let lastT = 0;

  document.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    const t = e.touches && e.touches[0];
    if (t) { mouse.x = t.clientX; mouse.y = t.clientY; }
  }, { passive: true });

  function tick(t) {
    requestAnimationFrame(tick);
    if (!state.petOn) { lastT = t; return; }
    const dt = Math.min(64, t - lastT || 16);
    lastT = t;

    // 平滑跟随（与帧率无关的指数插值）
    const ease = 1 - Math.pow(0.0012, dt / 1000);
    const dx = mouse.x - pos.x;
    const dy = mouse.y - pos.y;
    pos.x += dx * ease;
    pos.y += dy * ease;

    vel.x = (dx * ease) / dt * 1000;
    vel.y = (dy * ease) / dt * 1000;

    const speed = Math.hypot(vel.x, vel.y);
    const tilt = clamp(vel.x * 0.019, -10, 10);
    const bobAmp = 1.5 + Math.min(speed * 0.010, 5.5);
    const bob = Math.sin(t / 430) * bobAmp;
    const breathe = 1 + Math.sin(t / 950) * 0.014;
    const stretch = 1 + Math.min(speed * 0.0009, 0.06);

    petStage.style.transform = `translate3d(${pos.x.toFixed(2)}px, ${pos.y.toFixed(2)}px, 0)`;
    petInner.style.transform =
      `translate(-50%,-50%) translateY(${bob.toFixed(2)}px) rotate(${tilt.toFixed(2)}deg) scale(${(breathe * stretch).toFixed(4)},${(2 - breathe * stretch).toFixed(4)})`;
  }
  requestAnimationFrame(tick);

  /* =========================================================
     事件绑定
     ========================================================= */
  // 上传
  dropzone.addEventListener('click', openFilePicker);
  dropzone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openFilePicker(); }
  });
  fileInput.addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) handleFile(f);
  });

  // 拖放
  let dragDepth = 0;
  document.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragDepth++;
    dropzone.classList.add('drag');
  });
  document.addEventListener('dragover', (e) => { e.preventDefault(); });
  document.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) dropzone.classList.remove('drag');
  });
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    dragDepth = 0;
    dropzone.classList.remove('drag');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });

  // 滑块
  const tolRange = $('#tolRange');
  const featherRange = $('#featherRange');
  tolRange.addEventListener('input', () => {
    state.userTouched = true;
    state.opts.tolerance = +tolRange.value;
    $('#tolVal').textContent = tolRange.value;
    scheduleRecompute();
  });
  featherRange.addEventListener('input', () => {
    state.userTouched = true;
    state.opts.feather = +featherRange.value;
    $('#featherVal').textContent = featherRange.value;
    scheduleRecompute();
  });

  $('#resetBtn').addEventListener('click', () => {
    state.opts.tolerance = 30;
    state.opts.feather = 2;
    tolRange.value = 30;
    featherRange.value = 2;
    $('#tolVal').textContent = '30';
    $('#featherVal').textContent = '2';
    runMatte();
  });

  $('#aiBtn').addEventListener('click', runAI);

  // 召唤 / 追加形象
  $('#summonBtn').addEventListener('click', () => {
    if (!state.matteURL) { toast('请先上传图片'); return; }
    const existing = state.pets.find(p => p.url === state.matteURL);
    if (!existing) {
      if (!addPet(state.matteURL)) return;
    } else {
      state.activeId = existing.id;
    }
    startPet();
  });

  $('#addMoreBtn').addEventListener('click', openFilePicker);
  $('#uploadMoreBtn').addEventListener('click', openFilePicker);

  // 控制坞
  $('#togglePanel').addEventListener('click', () => dockPanel.classList.toggle('open'));
  $('#dockAvatar').addEventListener('click', () => dockPanel.classList.toggle('open'));
  $('#cancelBtn').addEventListener('click', dismissPet);

  const sizeRange = $('#sizeRange');
  const hueRange = $('#hueRange');
  sizeRange.addEventListener('input', () => {
    state.pet.size = +sizeRange.value;
    $('#sizeVal').textContent = sizeRange.value;
    applyPetSize();
    if (ON_DESKTOP && state.petOn) DP.update({ size: state.pet.size });
  });
  hueRange.addEventListener('input', () => {
    state.pet.hue = +hueRange.value;
    $('#hueVal').textContent = hueRange.value;
    petImg.style.filter = state.pet.hue ? `hue-rotate(${state.pet.hue}deg)` : 'none';
    if (ON_DESKTOP && state.petOn) DP.update({ hue: state.pet.hue });
  });
  $('#flipBtn').addEventListener('click', () => {
    state.pet.flip = !state.pet.flip;
    petImg.style.transform = state.pet.flip ? 'scaleX(-1)' : 'none';
    if (ON_DESKTOP && state.petOn) DP.update({ flip: state.pet.flip });
  });

  // 桌面版：托盘或全局快捷键取消了宠物，页面控制坞同步收起
  if (ON_DESKTOP) {
    DP.onExternalDismiss(() => {
      if (!state.petOn) return;
      state.petOn = false;
      dock.classList.remove('show');
      dockPanel.classList.remove('open');
      setStatus('抠图完成', false);
    });

    // 说明文字换成桌面版的说法
    const foot = document.querySelector('.foot-note');
    if (foot) {
      foot.innerHTML =
        '所有已生成形象会按槽位组成队伍，跟着鼠标走遍所有窗口 · ' +
        '关闭或离开工坊后它仍会留在桌面；按 <kbd>Esc</kbd>、点「取消宠物」或托盘右键随时收回 · ' +
        '所有图片仅在本机处理，不会上传服务器';
    }
    const tip = document.querySelector('#summonBtn + .tip');
    if (tip) tip.textContent = '召唤后所有已生成形象会排成队伍跟在鼠标后面；关闭工坊不会消失，点击穿透，不影响你正常操作。';
    // 返回工坊时恢复仍在桌面运行的形象与控制坞（例如离开页面后重新打开）
    (async () => {
      try {
        const saved = await DP.getState();
        if (!saved || !saved.active) return;
        const savedPets = Array.isArray(saved.pets) && saved.pets.length
          ? saved.pets
          : (saved.url ? [{ id: 'pet-restored', name: '小家伙 1', url: saved.url }] : []);
        if (!savedPets.length) return;
        for (const item of savedPets) {
          if (!item || !item.url) continue;
          if (!state.pets.some(p => p.id === item.id || p.url === item.url)) addPet(item.url, item);
        }
        const restoredActive = state.pets.find(p => p.id === saved.activeId) || state.pets[0];
        if (!restoredActive) return;
        state.activeId = restoredActive.id;
        renderGalleries();
        if (Number.isFinite(saved.size)) state.pet.size = saved.size;
        if (Number.isFinite(saved.hue)) state.pet.hue = saved.hue;
        if (typeof saved.flip === 'boolean') state.pet.flip = saved.flip;
        state.petOn = true;
        petStage.classList.add('hidden');
        dock.classList.add('show');
        dockName.textContent = restoredActive.name;
        dockAvatarImg.src = restoredActive.url;
        sizeRange.value = state.pet.size;
        hueRange.value = state.pet.hue;
        $('#sizeVal').textContent = state.pet.size;
        $('#hueVal').textContent = state.pet.hue;
        petImg.style.filter = state.pet.hue ? `hue-rotate(${state.pet.hue}deg)` : 'none';
        petImg.style.transform = state.pet.flip ? 'scaleX(-1)' : 'none';
        setStatus('宠物已上桌面', false);
      } catch (_) { /* getState 不可用时保持网页版行为 */ }
    })();
  }

  // 键盘
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.petOn) dismissPet();
    if (e.key === ' ' && state.petOn && document.activeElement === document.body) {
      e.preventDefault();
      popPet();
    }
  });

  // 窗口尺寸变化时重算宠物尺寸
  window.addEventListener('resize', () => {
    if (state.petOn) applyPetSize();
  });

  // 初始化宠物可变形参数
  if (!state.pet) state.pet = { size: 160, hue: 0, flip: false };

  /* 首屏提示 */
  setTimeout(() => {
    if (!state.sourceImg && !state.petOn) setStatus('等待上传', false);
  }, 300);

})();
</script>
</body>
</html>
